[pytest]
pythonpath = .
testpaths = qa/ui/tests qa/api
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -s --html=qa/selenium/reports/report.html --self-contained-html
markers =
    smoke: Quick critical path tests
    regression: Full regression test suite
    api: Direct REST API test suite
    selenium: End-to-end browser tests
